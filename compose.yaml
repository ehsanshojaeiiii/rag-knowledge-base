services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    models:
      llm:
        endpoint_var: LLM_BASE_URL
        model_var: LLM_MODEL
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

# Pulled and served by Docker Model Runner on the host GPU; Compose passes its URL and name to the API.
models:
  llm:
    model: ai/gemma4:e4b
    context_size: 8192

volumes:
  pgdata:
