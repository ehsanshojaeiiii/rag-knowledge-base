services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # for `make dev`; change if 5432 is taken
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b-it-qat}
      # Gemma 4 thinks before answering; measured, thinking was 4-5x slower and not more accurate.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  # Serves the language model through Ollama's OpenAI-compatible API.
  ollama:
    image: ollama/ollama:0.40.12
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # Downloads the model on first start (cached in the ollama volume afterwards), then exits.
  ollama-pull:
    image: ollama/ollama:0.40.12
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-gemma4:e4b-it-qat}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
