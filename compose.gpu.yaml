# `make run-gpu`: the language model runs in Ollama installed on the host instead of the Ollama container.
# Docker containers on macOS cannot reach the Apple GPU; native Ollama uses it (Metal), several times faster.
# Same model build as `make run` (Gemma 4 e4b QAT), so the measured results apply to both (decision 10).
# Needs Ollama on the host (`brew install ollama`, then `ollama serve` or the Ollama app). Used on top of
# compose.yaml:  docker compose -f compose.yaml -f compose.gpu.yaml up --build --detach --wait
services:
  api:
    environment: !override
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b-it-qat}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
    depends_on: !override
      db:
        condition: service_healthy

  # Not started: the host's Ollama serves the model.
  ollama:
    profiles: [ollama]
  ollama-pull:
    profiles: [ollama]
